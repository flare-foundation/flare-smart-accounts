minimumReleaseAge: 10080
trustPolicy: no-downgrade
# pnpm install/build-script (lifecycle) policy: no dependency install scripts.
#   - esbuild: its platform executable ships as an optional dependency, so the postinstall is
#     unnecessary.
#   - keccak/secp256k1 (transitive via @openzeppelin/upgrades-core): a compatible prebuild may
#     still load, and the bundled JS fallback is used otherwise, so the upgrade-safety validator
#     needs no native build or C++ toolchain.
# Scoped to the resolved versions so a bump re-triggers this review; omitting an entry makes an
# install fail (unapproved build script).
allowBuilds:
  "esbuild@0.27.7": false
  "keccak@3.0.4": false
  "secp256k1@4.0.5": false
