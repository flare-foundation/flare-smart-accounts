[profile.default]
src = "contracts"
out = "artifacts"
cache_path = 'cache'
evm_version = 'cancun'
optimizer = true
optimizer_runs = 200
solc_version = '0.8.35'
libs = [
    "lib",
    "node_modules",
    "dependencies",
]
fs_permissions = [
    { access = "read", path = "deployment/chain-config/" },
    { access = "read", path = "deployment/deploys/" },
    { access = "read", path = "deployment/pinned-init-code/" },
    { access = "read-write", path = "deployment/output-internal" },
    { access = "read", path = "deployment/cuts/" },
    { access = "read", path = "artifacts/" },
    { access = "read", path = "deployment/market-config/" }
]
ffi = true
via_ir = true

# Isolated build for the OpenZeppelin upgrade-safety validator (`pnpm build:upgrade-info` then
# `pnpm validate-upgrade`): full build-info plus storage layouts, in its own out and cache dirs.
[profile.upgrade_validation]
out = "artifacts-upgrades"
cache_path = "cache-upgrades"
build_info = true
extra_output = ["storageLayout"]

[dependencies]
"@openzeppelin-contracts" = "5.5.0"
"@openzeppelin-contracts-upgradeable" = "5.5.0"
forge-std = "1.10.0"
flare-periphery = "0.1.52"
"@layerzerolabs-oft-evm" = "4.0.1"
"@layerzerolabs-lz-evm-protocol-v2" = "3.0.159"
"@layerzerolabs-oapp-evm" = "0.4.1"


[soldeer]
remappings_generate = false
remappings_regenerate = false
remappings_version = false
remappings_location = "txt"
recursive_deps = true


# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
